<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>故事表单</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-50 p-6">
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <!-- 头部标题 -->
      <div class="border-b border-gray-200 px-6 py-4">
        <h2 class="text-xl font-semibold text-gray-800">新建故事</h2>
      </div>

      <!-- 表单内容 -->
      <form class="p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- 第一列 -->
          <div class="space-y-4">
            <!-- 故事名称 -->
            <div>
              <label
                for="name"
                class="block text-sm font-medium text-gray-700 mb-1"
                >故事名称 <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                id="name"
                name="name"
                maxlength="30"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
              />
              <p class="mt-1 text-xs text-gray-500">最多30个字符</p>
            </div>

            <!-- 故事别名 -->
            <div>
              <label
                for="alias"
                class="block text-sm font-medium text-gray-700 mb-1"
                >故事别名</label
              >
              <div class="flex space-x-2">
                <input
                  type="text"
                  id="alias"
                  name="alias"
                  maxlength="30"
                  class="flex-1 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                />
                <button
                  type="button"
                  class="px-3 py-2 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200"
                >
                  <i class="fas fa-plus"></i>
                </button>
              </div>
              <div class="mt-2 space-y-1">
                <span
                  class="inline-flex items-center px-2 py-1 bg-gray-100 text-gray-800 text-xs rounded-full mr-1"
                >
                  小白兔的故事
                  <button
                    type="button"
                    class="ml-1 text-gray-500 hover:text-gray-700"
                  >
                    <i class="fas fa-times"></i>
                  </button>
                </span>
                <span
                  class="inline-flex items-center px-2 py-1 bg-gray-100 text-gray-800 text-xs rounded-full"
                >
                  乖乖兔
                  <button
                    type="button"
                    class="ml-1 text-gray-500 hover:text-gray-700"
                  >
                    <i class="fas fa-times"></i>
                  </button>
                </span>
              </div>
              <p class="mt-1 text-xs text-gray-500">每个别名最多30个字符</p>
            </div>

            <!-- 故事类型 -->
            <div>
              <label
                for="type"
                class="block text-sm font-medium text-gray-700 mb-1"
                >故事类型 <span class="text-red-500">*</span></label
              >
              <select
                id="type"
                name="type"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
              >
                <option value="">请选择故事类型</option>
                <option value="1">童话故事</option>
                <option value="2">寓言故事</option>
                <option value="3">科普故事</option>
              </select>
            </div>

            <!-- 故事主题 -->
            <div>
              <label
                for="theme"
                class="block text-sm font-medium text-gray-700 mb-1"
                >故事主题</label
              >
              <select
                id="theme"
                name="theme"
                multiple
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
              >
                <option value="1">友情</option>
                <option value="2">勇气</option>
                <option value="3">诚实</option>
                <option value="4">安全</option>
              </select>
            </div>
          </div>

          <!-- 第二列 -->
          <div class="space-y-4">
            <!-- 故事集 -->
            <div>
              <label
                for="collection"
                class="block text-sm font-medium text-gray-700 mb-1"
                >故事集</label
              >
              <select
                id="collection"
                name="collection"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
              >
                <option value="">请选择故事集</option>
                <option value="1">睡前故事集</option>
                <option value="2">启蒙故事集</option>
              </select>
            </div>

            <!-- 适合年龄 -->
            <div>
              <label
                for="age"
                class="block text-sm font-medium text-gray-700 mb-1"
                >适合年龄 <span class="text-red-500">*</span></label
              >
              <select
                id="age"
                name="age"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
              >
                <option value="">请选择适合年龄</option>
                <option value="0-3">0-3岁</option>
                <option value="4-6">4-6岁</option>
                <option value="7-9">7-9岁</option>
                <option value="10-12">10-12岁</option>
                <option value="13-15">13-15岁</option>
                <option value="15+">15岁以上</option>
              </select>
            </div>

            <!-- 故事封面 -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >故事封面</label
              >
              <div
                class="border-2 border-dashed border-gray-300 rounded-md p-4 text-center"
              >
                <div class="flex flex-col items-center justify-center">
                  <svg
                    class="mx-auto h-12 w-12 text-gray-400"
                    stroke="currentColor"
                    fill="none"
                    viewBox="0 0 48 48"
                    aria-hidden="true"
                  >
                    <path
                      d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                  <div class="mt-2 flex text-sm text-gray-600">
                    <label
                      for="cover"
                      class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none"
                    >
                      <span>上传图片</span>
                      <input
                        id="cover"
                        name="cover"
                        type="file"
                        class="sr-only"
                        accept="image/*"
                      />
                    </label>
                    <p class="pl-1">或拖拽到此处</p>
                  </div>
                  <p class="mt-1 text-xs text-gray-500">
                    PNG, JPG, GIF 格式，不超过2MB
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 故事内容 -->
        <div class="mt-6">
          <label
            for="content"
            class="block text-sm font-medium text-gray-700 mb-1"
            >故事内容 <span class="text-red-500">*</span></label
          >
          <textarea
            id="content"
            name="content"
            rows="8"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          ></textarea>
        </div>

        <!-- 教育意义 -->
        <div class="mt-6">
          <label
            for="meaning"
            class="block text-sm font-medium text-gray-700 mb-1"
            >教育意义</label
          >
          <textarea
            id="meaning"
            name="meaning"
            rows="4"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          ></textarea>
        </div>

        <!-- 表单操作 -->
        <div class="mt-8 flex justify-end space-x-3">
          <a
            href="list.html"
            class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
          >
            取消
          </a>
          <button
            type="submit"
            class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700"
          >
            提交
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
