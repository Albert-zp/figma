<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>故事列表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-50 p-6">
    <div class="bg-white rounded-lg shadow p-6">
      <!-- 筛选区域 -->
      <div class="mb-6">
        <h2 class="text-lg font-semibold mb-4">故事筛选</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >故事名称</label
            >
            <input
              type="text"
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >故事类型</label
            >
            <select
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            >
              <option value="">全部</option>
              <option>童话故事</option>
              <option>寓言故事</option>
              <option>科普故事</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >故事主题</label
            >
            <select
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            >
              <option value="">全部</option>
              <option>友情</option>
              <option>勇气</option>
              <option>诚实</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >故事集</label
            >
            <select
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            >
              <option value="">全部</option>
              <option>睡前故事集</option>
              <option>启蒙故事集</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >状态</label
            >
            <select
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            >
              <option value="">全部</option>
              <option>已上架</option>
              <option>已下架</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end mt-4 space-x-3">
          <button
            class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
          >
            重置
          </button>
          <button
            class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700"
          >
            查询
          </button>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold">故事列表</h2>
        <a
          href="form.html"
          class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700"
        >
          <i class="fas fa-plus mr-1"></i>新建故事
        </a>
      </div>

      <!-- 表格区域 -->
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                故事ID
              </th>
              <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                故事名称
              </th>
              <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                故事类型
              </th>
              <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                故事主题
              </th>
              <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                故事集
              </th>
              <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                状态
              </th>
              <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                操作
              </th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <tr>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                ST001
              </td>
              <td
                class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"
              >
                小兔子乖乖
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                童话故事
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                诚实
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                睡前故事集
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span
                  class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800"
                  >已上架</span
                >
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                <a
                  href="detail.html?id=ST001"
                  class="text-blue-600 hover:text-blue-900 mr-3"
                  >查看</a
                >
              </td>
            </tr>
            <tr>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                ST002
              </td>
              <td
                class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"
              >
                乌鸦喝水
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                寓言故事
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                智慧
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                启蒙故事集
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span
                  class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800"
                  >已下架</span
                >
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                <a
                  href="detail.html?id=ST002"
                  class="text-blue-600 hover:text-blue-900 mr-3"
                  >查看</a
                >
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="flex items-center justify-between mt-4">
        <div class="text-sm text-gray-700">
          显示 <span class="font-medium">1</span> 到
          <span class="font-medium">2</span> 条，共
          <span class="font-medium">2</span> 条
        </div>
        <nav class="flex space-x-2">
          <button
            class="px-3 py-1 border border-gray-300 rounded text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50"
            disabled
          >
            上一页
          </button>
          <button
            class="px-3 py-1 border border-gray-300 rounded text-sm font-medium text-white bg-blue-600 hover:bg-blue-700"
          >
            1
          </button>
          <button
            class="px-3 py-1 border border-gray-300 rounded text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50"
            disabled
          >
            下一页
          </button>
        </nav>
      </div>
    </div>
  </body>
</html>
