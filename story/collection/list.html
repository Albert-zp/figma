<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>故事集管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-50 p-6">
    <div class="bg-white rounded-lg shadow p-6">
      <!-- 操作按钮 -->
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold">故事集列表</h2>
        <a
          href="form.html"
          class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700"
        >
          <i class="fas fa-plus mr-1"></i>新增故事集
        </a>
      </div>

      <!-- 表格区域 -->
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                集ID
              </th>
              <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                集名称
              </th>
              <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                创建时间
              </th>
              <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                操作
              </th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <tr>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                1
              </td>
              <td
                class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"
              >
                睡前故事集
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                2023-05-08 14:20:15
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                <a
                  href="form.html?id=1"
                  class="text-blue-600 hover:text-blue-900 mr-3"
                  >编辑</a
                >
                <a href="#" class="text-red-600 hover:text-red-900">删除</a>
              </td>
            </tr>
            <tr>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                2
              </td>
              <td
                class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"
              >
                童话故事集
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                2023-05-09 09:45:22
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                <a
                  href="form.html?id=2"
                  class="text-blue-600 hover:text-blue-900 mr-3"
                  >编辑</a
                >
                <a href="#" class="text-red-600 hover:text-red-900">删除</a>
              </td>
            </tr>
            <tr>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                3
              </td>
              <td
                class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"
              >
                寓言故事集
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                2023-05-10 11:30:45
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                <a
                  href="form.html?id=3"
                  class="text-blue-600 hover:text-blue-900 mr-3"
                  >编辑</a
                >
                <a href="#" class="text-red-600 hover:text-red-900">删除</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="flex items-center justify-between mt-4">
        <div class="text-sm text-gray-700">
          显示 <span class="font-medium">1</span> 到
          <span class="font-medium">3</span> 条，共
          <span class="font-medium">3</span> 条
        </div>
        <nav class="flex space-x-2">
          <button
            class="px-3 py-1 border border-gray-300 rounded text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50"
            disabled
          >
            上一页
          </button>
          <button
            class="px-3 py-1 border border-gray-300 rounded text-sm font-medium text-white bg-blue-600 hover:bg-blue-700"
          >
            1
          </button>
          <button
            class="px-3 py-1 border border-gray-300 rounded text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50"
            disabled
          >
            下一页
          </button>
        </nav>
      </div>
    </div>
  </body>
</html>
